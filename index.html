<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - World Country War (God Mode Enabled)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #070913;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        /* Top Marquee Banner */
        .ticker-container {
            background: linear-gradient(90deg, #1e1b4b, #311042, #1e1b4b);
            border-bottom: 2px solid #a855f7;
            overflow: hidden;
            white-space: nowrap;
            padding: 6px 0;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .ticker-text {
            display: inline-block;
            animation: ticker 30s linear infinite;
            color: #f3e8ff;
        }
        .ticker-text span {
            margin: 0 20px;
        }
        .ticker-text .highlight {
            color: #f43f5e;
            font-weight: bold;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* Top Bar with God Mode info */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            padding: 6px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            z-index: 30;
        }
        .god-badge {
            background: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.8; }
        }

        /* Arena where bubbles float scattered */
        .arena {
            position: relative;
            flex: 1;
            width: 100%;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            overflow: hidden;
        }

        /* Scattered Country Bubbles */
        .country-bubble {
            position: absolute;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 50px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 85px;
            z-index: 10;
        }
        .country-bubble:hover {
            border-color: #f43f5e;
            transform: scale(1.1) !important;
        }
        .country-bubble h4 {
            font-size: 11px;
            white-space: nowrap;
        }
        .country-bubble .pts {
            font-size: 9px;
            opacity: 0.8;
        }

        /* Event Feed & Floating items */
        .event-feed {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            flex-direction: column-reverse;
            gap: 4px;
            max-height: 120px;
            overflow: hidden;
            pointer-events: none;
            z-index: 40;
            font-size: 10px;
        }
        .feed-item {
            background: rgba(30, 41, 59, 0.9);
            padding: 4px 8px;
            border-radius: 6px;
            border-left: 2px solid #a855f7;
            white-space: nowrap;
        }

        .floating-gifts {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            flex-direction: column-reverse;
            align-items: flex-end;
            gap: 4px;
            max-height: 130px;
            overflow: hidden;
            pointer-events: none;
            z-index: 40;
            font-size: 10px;
        }
        .floating-gift-item {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.5);
            padding: 4px 8px;
            border-radius: 6px;
            animation: fadeInOut 3s ease forwards;
            white-space: nowrap;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Top Scrolling Banner -->
    <div class="ticker-container">
        <div class="ticker-text">
            <span>🌹 ROSE (1 💎) - LION (29999 💎) - CASTLE (20000 💎) - UNIVERSE (34999 💎)</span>
            <span>🌍 CLICK ANY COUNTRY BUBBLE TO TEST GOD MODE (SENDS GIFT INSTANTLY) 🌍</span>
            <span class="highlight">🚀 THE BIGGER THE GIFT, THE FASTER THE BUBBLE GROWS! 🚀</span>
        </div>
    </div>

    <!-- Top Bar with God Mode info -->
    <div class="top-bar">
        <span><b>TikTok Live War</b> (Multi-Country Arena)</span>
        <span class="god-badge">God Mode Active: Click Bubbles to Test</span>
    </div>

    <!-- Arena with Scattered Country Bubbles -->
    <div class="arena" id="arena">
        <!-- Event Feed -->
        <div class="event-feed" id="eventFeed"></div>
        <!-- Floating Gifts -->
        <div class="floating-gifts" id="floatingGifts"></div>
    </div>

    <script>
        const countries = {
            usa: { name: "USA", flag: "🇺🇸", score: 12500, x: 12, y: 28, color: "#38bdf8" },
            france: { name: "France", flag: "🇫🇷", score: 15000, x: 48, y: 22, color: "#60a5fa" },
            brazil: { name: "Brazil", flag: "🇧🇷", score: 8200, x: 28, y: 62, color: "#4ade80" },
            russia: { name: "Russia", flag: "🇷🇺", score: 6400, x: 75, y: 18, color: "#f87171" },
            china: { name: "China", flag: "🇨🇳", score: 9100, x: 78, y: 48, color: "#fca5a5" },
            india: { name: "India", flag: "🇮🇳", score: 11000, x: 65, y: 52, color: "#fbbf24" },
            mexico: { name: "Mexico", flag: "🇲🇽", score: 5400, x: 15, y: 55, color: "#34d399" },
            germany: { name: "Germany", flag: "🇩🇪", score: 7300, x: 56, y: 35, color: "#a78bfa" },
            japan: { name: "Japan", flag: "🇯🇵", score: 9800, x: 88, y: 35, color: "#f43f5e" },
            uk: { name: "UK", flag: "🇬🇧", score: 8900, x: 40, y: 32, color: "#38bdf8" }
        };

        const gifts = [
            { name: "Rose", icon: "🌹", value: 1, weight: 1 },
            { name: "Lion", icon: "🦁", value: 29999, weight: 40 },
            { name: "Castle", icon: "🏰", value: 20000, weight: 30 },
            { name: "Universe", icon: "🌌", value: 34999, weight: 60 }
        ];

        const usernames = ["Jean", "Mike", "Alex", "Lucas", "Sophie", "Emma", "David", "Carlos", "Priya", "Hiroshi"];
        const arena = document.getElementById("arena");

        function initBubbles() {
            for (let key in countries) {
                let c = countries[key];
                let bubble = document.createElement("div");
                bubble.className = "country-bubble";
                bubble.id = `bubble-${key}`;
                bubble.style.left = c.x + "%";
                bubble.style.top = c.y + "%";
                bubble.style.borderColor = c.color;
                bubble.style.background = c.color + "33";
                
                bubble.innerHTML = `
                    <h4>${c.flag} ${c.name}</h4>
                    <span class="pts" id="pts-${key}">${c.score.toLocaleString()} pts</span>
                `;

                // God Mode: Click to test growth instantly
                bubble.addEventListener("click", () => {
                    let randomGift = gifts[Math.floor(Math.random() * gifts.length)];
                    let randomUser = usernames[Math.floor(Math.random() * usernames.length)];
                    addEvent(randomUser, key, randomGift);
                });

                arena.appendChild(bubble);
            }
        }

        function updateUI() {
            for (let key in countries) {
                let c = countries[key];
                let ptsEl = document.getElementById(`pts-${key}`);
                if (ptsEl) ptsEl.innerText = c.score.toLocaleString() + " pts";

                let bubble = document.getElementById(`bubble-${key}`);
                if (bubble) {
                    let scale = 1 + (c.score / 150000);
                    if (scale > 1.5) scale = 1.5;
                    bubble.style.transform = `scale(${scale})`;
                }
            }
        }

        function addEvent(username, countryKey, gift) {
            let country = countries[countryKey];
            country.score += gift.value * (gift.weight > 1 ? 50 : 1);
            updateUI();

            let feed = document.getElementById("eventFeed");
            let feedItem = document.createElement("div");
            feedItem.className = "feed-item";
            feedItem.innerHTML = `${country.flag} <b>${username}</b> sent <span style="color:#f43f5e;">${gift.icon} ${gift.name}</span> to ${country.name}`;
            feed.prepend(feedItem);
            if (feed.children.length > 4) feed.lastChild.remove();

            let floating = document.getElementById("floatingGifts");
            let floatItem = document.createElement("div");
            floatItem.className = "floating-gift-item";
            floatItem.innerHTML = `${country.flag} ${gift.icon} <b>${gift.name}</b> (+${(gift.value * (gift.weight > 1 ? 50 : 1)).toLocaleString()})`;
            floating.prepend(floatItem);
            setTimeout(() => floatItem.remove(), 3000);
            if (floating.children.length > 5) floating.lastChild.remove();
        }

        setInterval(() => {
            let keys = Object.keys(countries);
            let randomCountry = keys[Math.floor(Math.random() * keys.length)];
            let randomUser = usernames[Math.floor(Math.random() * usernames.length)];
            let randomGift = gifts[Math.floor(Math.random() * gifts.length)];
            addEvent(randomUser, randomCountry, randomGift);
        }, 2200);

        initBubbles();
    </script>
</body>
</html>
