<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANOPÉE — Adoptez un arbre, changez le monde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --paper: #EEF2E8;
            --paper-dark: #D5DDCE;
            --ink: #1C3229;
            --ink-soft: #4C6157;
            --ink-faint: #8A9C92;
            --canopy: #2F6E4E;
            --canopy-light: #4CAF7A;
            --canopy-bright: #3E9268;
            --sun: #D9A441;
            --sun-light: #F5D98A;
            --sky: #C7E2E6;
            --sky-deep: #A9CDD3;
            --ocean: #B5D8E0;
            --card: #FFFFFF;
            --line: rgba(28, 50, 41, 0.14);
            --line-strong: rgba(28, 50, 41, 0.30);
            --shadow: rgba(28, 50, 41, 0.15);
            --danger: #B8483F;
            --gold: #C9A84C;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* MAP */
        #mapViewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #B5D8E0 0%, #C7E2E6 40%, #E8F0E8 100%);
            cursor: grab;
            touch-action: none;
        }

        #mapViewport.dragging {
            cursor: grabbing;
        }

        #mapWorld {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #mapWorld.panning {
            transition: none;
        }

        .continent {
            position: absolute;
            background: linear-gradient(145deg, #E8EDE0, #D0D8C8);
            border: 1px solid rgba(28, 50, 41, 0.08);
            box-shadow: 0 8px 32px rgba(28, 50, 41, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            transition: box-shadow 0.3s;
            cursor: pointer;
        }

        .continent:hover {
            box-shadow: 0 8px 40px rgba(28, 50, 41, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .continent .region-label {
            position: absolute;
            font-family: var(--font-display);
            font-style: italic;
            font-size: 13px;
            color: var(--ink-soft);
            font-weight: 500;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.6);
            opacity: 0.7;
        }

        .continent:hover .region-label {
            opacity: 1;
        }

        /* TREE MARKERS */
        .tree-marker {
            position: absolute;
            transform: translate(-50%, -100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }

        .tree-marker:hover {
            transform: translate(-50%, -100%) scale(1.2);
            z-index: 10;
        }

        .tree-marker .t-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card);
            border: 2px solid var(--ink-faint);
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(28, 50, 41, 0.2);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .tree-marker[data-owner="user"] .t-icon {
            border-color: var(--canopy-bright);
            box-shadow: 0 0 0 4px rgba(62, 146, 104, 0.2), 0 4px 12px rgba(28, 50, 41, 0.2);
        }

        .tree-marker[data-rarity="epic"] .t-icon {
            border-color: #8B5FBF;
            box-shadow: 0 0 0 3px rgba(139, 95, 191, 0.2), 0 4px 12px rgba(28, 50, 41, 0.2);
        }

        .tree-marker[data-rarity="legendary"] .t-icon {
            border-color: var(--gold);
            box-shadow: 0 0 0 6px rgba(201, 168, 76, 0.25), 0 4px 20px rgba(201, 168, 76, 0.3);
            animation: legendaryGlow 2.6s ease-in-out infinite;
        }

        @keyframes legendaryGlow {
            0%,
            100% {
                box-shadow: 0 0 0 6px rgba(201, 168, 76, 0.25), 0 4px 20px rgba(201, 168, 76, 0.3);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(201, 168, 76, 0.1), 0 4px 30px rgba(201, 168, 76, 0.4);
            }
        }

        .tree-marker.stage-2 .t-icon {
            width: 34px;
            height: 34px;
            font-size: 18px;
        }

        .tree-marker.stage-3 .t-icon {
            width: 42px;
            height: 42px;
            font-size: 22px;
            border-width: 3px;
        }

        .tree-marker.exploding .t-icon {
            animation: explodeGrow 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes explodeGrow {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            20% {
                transform: scale(2.5);
                opacity: 1;
                box-shadow: 0 0 80px rgba(62, 146, 104, 0.6);
            }
            50% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .tree-marker.selected .t-icon {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        .t-price {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--ink-soft);
            background: rgba(255, 255, 255, 0.92);
            padding: 1px 6px;
            border-radius: 10px;
            border: 1px solid var(--line);
            font-weight: 600;
            letter-spacing: 0.02em;
            backdrop-filter: blur(4px);
        }

        .t-price.owned {
            color: var(--canopy-bright);
            border-color: var(--canopy-bright);
        }

        /* PARTICLES */
        .particle-container {
            position: absolute;
            pointer-events: none;
            z-index: 50;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFly 1.5s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* TOPBAR */
        .topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 68px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: linear-gradient(180deg, rgba(238, 242, 232, 0.95) 0%, rgba(238, 242, 232, 0) 100%);
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            cursor: pointer;
        }

        .brand-mark {
            font-size: 28px;
            filter: drop-shadow(0 2px 8px rgba(28, 50, 41, 0.15));
            transition: transform 0.3s;
        }

        .brand:hover .brand-mark {
            transform: rotate(-5deg) scale(1.05);
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--ink);
        }

        .brand-name em {
            font-style: italic;
            color: var(--canopy-bright);
            font-weight: 600;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .wallet-pill {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 8px 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(28, 50, 41, 0.08);
        }

        .wallet-pill b {
            color: var(--canopy-bright);
            font-weight: 600;
        }

        .wallet-pill .sep {
            width: 1px;
            height: 20px;
            background: var(--line-strong);
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(28, 50, 41, 0.08);
            color: var(--ink-soft);
            transition: all 0.3s;
            font-family: var(--font-body);
            pointer-events: auto;
        }

        .mode-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 30px rgba(28, 50, 41, 0.12);
        }

        .mode-toggle.active {
            background: var(--ink);
            color: #EEF2E8;
            border-color: var(--ink);
        }

        .mode-toggle .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ink-faint);
            transition: all 0.3s;
        }

        .mode-toggle.active .dot {
            background: var(--sun);
            box-shadow: 0 0 12px var(--sun);
        }

        /* SIDEBAR */
        .sidebar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            z-index: 15;
            padding: 88px 20px 20px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.92);
            border-right: 1px solid var(--line);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 2px;
        }

        .block-title {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--ink-faint);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-card {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            background: var(--paper-2);
        }

        .stat-label {
            font-size: 9px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 17px;
            font-weight: 600;
            color: var(--ink);
        }

        .stat-value.accent {
            color: var(--canopy-bright);
        }

        .stat-value.gold {
            color: var(--gold);
        }

        .co2-banner {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(62, 146, 104, 0.08), rgba(62, 146, 104, 0.02));
            font-size: 12px;
            color: var(--ink-soft);
            line-height: 1.6;
        }

        .co2-banner b {
            color: var(--canopy-bright);
            font-family: var(--font-mono);
        }

        .rarity-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            font-size: 10px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: var(--card);
            cursor: pointer;
            color: var(--ink-soft);
            font-weight: 600;
            transition: all 0.25s;
            font-family: var(--font-body);
        }

        .chip:hover {
            border-color: var(--line-strong);
        }

        .chip.on {
            background: var(--ink);
            color: #EEF2E8;
            border-color: var(--ink);
        }

        .region-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .region-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--ink-soft);
            transition: all 0.2s;
        }

        .region-item:hover {
            background: var(--paper-2);
            color: var(--ink);
        }

        .region-item .count {
            font-family: var(--font-mono);
            color: var(--ink-faint);
            font-size: 11px;
            font-weight: 500;
        }

        .footer-hint {
            margin-top: auto;
            font-size: 10px;
            color: var(--ink-faint);
            line-height: 1.8;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }

        .footer-hint kbd {
            background: var(--paper-2);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 1px 6px;
            font-family: var(--font-mono);
            font-size: 9px;
        }

        /* ZOOM CONTROLS */
        .zoom-controls {
            position: absolute;
            right: 24px;
            bottom: 24px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
            box-shadow: 0 4px 20px rgba(28, 50, 41, 0.1);
        }

        .zoom-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--ink-soft);
            cursor: pointer;
            background: none;
            border: none;
            transition: all 0.2s;
            font-family: var(--font-body);
        }

        .zoom-btn:hover {
            background: var(--paper-2);
            color: var(--ink);
        }

        .zoom-btn+.zoom-btn {
            border-top: 1px solid var(--line);
        }

        /* DETAIL PANEL */
        .detail-panel {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 400px;
            z-index: 30;
            background: var(--card);
            border-left: 1px solid var(--line);
            transform: translateX(105%);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            overflow-y: auto;
            box-shadow: -10px 0 60px rgba(28, 50, 41, 0.12);
        }

        .detail-panel.open {
            transform: translateX(0);
        }

        .detail-panel::-webkit-scrollbar {
            width: 4px;
        }

        .detail-panel::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 2px;
        }

        .detail-hero {
            position: relative;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--paper-2), var(--paper));
            border-bottom: 1px solid var(--line);
            overflow: hidden;
        }

        .detail-hero .rarity-band {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
        }

        .detail-hero-icon {
            font-size: 80px;
            filter: drop-shadow(0 8px 24px rgba(28, 50, 41, 0.2));
            animation: swayTree 5s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes swayTree {
            0%,
            100% {
                transform: rotate(-2deg) scale(1);
            }
            50% {
                transform: rotate(2deg) scale(1.02);
            }
        }

        .detail-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--ink-soft);
            transition: all 0.3s;
            z-index: 2;
        }

        .detail-close:hover {
            background: var(--paper-2);
            transform: rotate(90deg);
        }

        .detail-body {
            padding: 24px 26px;
        }

        .detail-tag {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .detail-title {
            font-family: var(--font-display);
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--ink);
        }

        .detail-region {
            font-size: 13px;
            color: var(--ink-faint);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-region span {
            background: var(--paper-2);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid var(--line);
        }

        .stage-track {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
        }

        .stage-dot {
            flex: 1;
            height: 6px;
            border-radius: 4px;
            background: var(--paper-2);
            border: 1px solid v
