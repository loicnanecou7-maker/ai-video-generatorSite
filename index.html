<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu des Pays TikTok</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; }
        .map-container { width: 80%; margin: auto; }
        /* Style des pays qui grandissent selon leur score */
        .country { transition: transform 0.3s ease; fill: #334155; stroke: #cbd5e1; }
    </style>
</head>
<body>
    <h1>🌍 Guerre des Pays en Direct !</h1>
    <p>Envoyez une **Rose** pour faire grandir votre pays !</p>

    <div class="map-container">
        <!-- Exemple simplifié de pays sous forme de blocs ou SVG -->
        <svg viewBox="0 0 1000 500" width="100%">
            <!-- France -->
            <path id="france" class="country" d="M150,150 L180,150 L180,180 L150,180 Z" transform="scale(1)" transform-origin="center" />
            <!-- USA -->
            <path id="usa" class="country" d="M50,100 L100,100 L100,150 L50,150 Z" transform="scale(1)" transform-origin="center" />
        </svg>
    </div>

    <script>
        // Code JavaScript pour écouter la base de données en temps réel 
        // et modifier la taille du pays (ex: transform: scale(1.5))
        function updateCountrySize(countryId, score) {
            const countryElement = document.getElementById(countryId);
            if (countryElement) {
                let scale = 1 + (score / 100); // Plus il y a de score, plus le pays grandit
                countryElement.style.transform = `scale(${scale})`;
            }
        }
    </script>
</body>
</html>
