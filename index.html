<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraNova - La Canopée Mondiale</title>
    <style>
        :root { --bg: #060906; --card: #111a12; --accent: #22c55e; --text: #f0fdf4; --border: #1a2e1c; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 650px; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }

        header { text-align: center; margin-top: 5px; }
        h1 { color: var(--accent); font-size: 1.6rem; margin: 0 0 5px 0; font-weight: 900; }
        p.subtitle { color: #86efac; font-size: 0.85rem; margin: 0; }

        /* Dashboard */
        .dashboard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; justify-content: space-around; align-items: center; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.1rem; font-weight: bold; color: #4ade80; }
        .stat-label { font-size: 0.7rem; color: #86efac; text-transform: uppercase; }

        /* God Panel */
        .god-panel { background: rgba(20, 40, 20, 0.8); border: 1px dashed var(--accent); padding: 10px; border-radius: 10px; font-size: 0.8rem; display: flex; flex-direction: column; gap: 5px; }
        .god-panel input { background: #000; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 0.8rem; }

        /* MAP SECTION (La Canopée) */
        .map-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .map-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold; color: #4ade80; }
        
        /* Grille de la Map interactive (Des dizaines de parcelles/arbres) */
        .world-map { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-height: 380px; overflow-y: auto; padding: 5px; background: #0a110a; border-radius: 10px; border: 1px solid var(--border); }
        
        .map-node { background: #162618; border: 1px solid #233d25; border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; transition: 0.15s; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .map-node:hover { border-color: var(--accent); transform: scale(1.03); }
        .map-node.owned-by-me { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; }
        .map-node.owned-by-other { background: rgba(234, 179, 8, 0.1); border-color: #ca8a04; opacity: 0.7; }
        
        .node-icon { font-size: 1.4rem; }
        .node-coords { font-size: 0.65rem; color: #86efac; }
        .node-price { font-size: 0.7rem; font-weight: bold; color: #4ade80; }

        /* Modale / Panneau d'achat de l'arbre sélectionné */
        .modal-card { background: #101c11; border: 2px solid var(--accent); border-radius: 14px; padding: 15px; display: none; flex-direction: column; gap: 10px; animation: fadeIn 0.2s; }
        .modal-card.active { display: flex; }
        .modal-title { font-weight: bold; font-size: 1rem; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .modal-details { font-size: 0.8rem; color: #a3e635; display: flex; flex-direction: column; gap: 4px; }
        
        .action-buttons { display: flex; gap: 8px; margin-top: 5px; }
        .btn-stripe { flex: 1; padding: 10px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 0.8rem; text-align: center; text-decoration: none; cursor: pointer; }
        .btn-god { flex: 1; padding: 10px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .btn-close { background: #334155; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌍 TerraNova Canopée</h1>
            <p class="subtitle">Explorez la map mondiale, trouvez votre parcelle et étendez votre empire forestier.</p>
        </header>

        <!-- Dashboard -->
        <div class="dashboard">
            <div class="stat-item">
                <div class="stat-value" id="user-points">250</div>
                <div class="stat-label">Points</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="user-trees">3</div>
                <div class="stat-label">Parcelles</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="tree-income">+35 pts/j</div>
                <div class="stat-label">Revenu</div>
            </div>
        </div>

        <!-- God Mode Admin Panel -->
        <div class="god-panel">
            <strong>🛠️ GOD MODE (Stripe Clients)</strong>
            <input type="text" id="admin-stripe-link" placeholder="Lien Stripe global (ex: https://buy.stripe.com/...)" value="https://buy.stripe.com/test_votre_lien">
        </div>

        <!-- MAP INTERACTIVE GLOBALE -->
        <div class="map-section">
            <div class="map-header">
                <span>📍 Carte Interactive (Secteur Alpha)</span>
                <span style="font-size: 0.75rem; color: #a3e635;">Cliquez sur un arbre pour interagir</span>
            </div>

            <!-- La grille générée dynamiquement (représentant des milliers de parcelles) -->
            <div class="world-map" id="world-map-grid">
                <!-- Les arbres de la map seront injectés ici par script -->
            </div>
        </div>

        <!-- Panneau d'interaction lorsqu'on clique sur un arbre de la map -->
        <div class="modal-card" id="tree-modal">
            <div class="modal-title">
                <span id="modal-tree-title">Sélection d'arbre</span>
                <button class="btn-close" onclick="closeModal()">Fermer</button>
            </div>
            <div class="modal-details" id="modal-tree-info">
                <!-- Infos injectées dynamiquement -->
            </div>
            <div class="action-buttons">
                <!-- Redirection Client vers Stripe -->
                <a href="https://buy.stripe.com/test_votre_lien" target="_blank" id="modal-stripe-btn" class="btn-stripe">Acheter (Client)</a>
                <!-- God Mode pour s'attribuer l'arbre direct -->
                <button class="btn-god" onclick="godClaimSelectedTree()">⚡ God Mode : S'attribuer</button>
            </div>
        </div>

    </div>

    <script>
        // Génération d'une map géante virtuelle de parcelles (ex: 36 arbres d'affichage initial, extensible à l'infini)
        const totalNodes = 36;
        let mapData = [];
        let selectedNodeIndex = null;

        let userPoints = 250;
        let userTreesCount = 3;
        let totalIncome = 35;

        // Initialisation de la map
        function initMap() {
            const grid = document.getElementById('world-map-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= totalNodes; i++) {
                // Attribuer aléatoirement un statut initial pour faire vivre la map
                let status = 'free';
                let owner = null;
                let price = (i % 5 === 0) ? 19.99 : 4.99;
                let income = price > 5 ? 25 : 5;
                let icon = i % 3 === 0 ? '🌳' : (i % 2 === 0 ? '🌿' : '🌱');

                // Quelques arbres déjà possédés par défaut pour le réalisme
                if (i === 3 || i === 12) {
                    status = 'owned-by-me';
                    owner = 'Vous';
                } else if (i === 7 || i === 20) {
                    status = 'owned-by-other';
                    owner = 'Investisseur_' + i;
                }

                mapData.push({ id: i, icon, price, income, status, owner, coords: `48.${i}82, 2.35${i}` });

                // Création visuelle du nœud sur la map
                const node = document.createElement('div');
                node.className = `map-node ${status === 'owned-by-me' ? 'owned-by-me' : (status === 'owned-by-other' ? 'owned-by-other' : '')}`;
                node.id = `node-${i}`;
                node.onclick = () => selectNode(i);

                node.innerHTML = `
                    <div class="node-icon">${icon}</div>
                    <div class="node-coords">#${i}</div>
                    <div class="node-price">${status === 'free' ? price + '€' : (owner === 'Vous' ? '👑' : '🔒')}</div>
                `;
                grid.appendChild(node);
            }
        }

        // Sélection d'un arbre sur la map
        function selectNode(index) {
            selectedNodeIndex = index - 1;
            const tree = mapData[selectedNodeIndex];
            const modal = document.getElementById('tree-modal');
            
            document.getElementById('modal-tree-title').innerText = `${tree.icon} Parcelle #${tree.id}`;
            
            let statusText = tree.status === 'free' ? '🟢 Disponible à l\'acquisition' : (tree.owner === 'Vous' ? '👑 Votre propriété (Canopée)' : `🔒 Propriété de ${tree.owner}`);
            
            document.getElementById('modal-tree-info').innerHTML = `
                <span>Coordonnées GPS : ${tree.coords}</span>
                <span>Revenu estimé : +${tree.income} pts/j</span>
                <span>Statut : <strong>${statusText}</strong></span>
                <span>Prix : <strong>${tree.price} €</strong></span>
            `;

            // Si déjà possédé par vous, cacher le bouton d'achat, sinon l'afficher
            const stripeBtn = document.getElementById('modal-stripe-btn');
            if (tree.status === 'owned-by-me') {
                stripeBtn.style.display = 'none';
            } else {
                stripeBtn.style.display = 'block';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('tree-modal').classList.remove('active');
        }

        // God Mode : S'attribuer l'arbre sélectionné instantanément sans passer par Stripe
        function godClaimSelectedTree() {
            if (selectedNodeIndex === null) return;
            const tree = mapData[selectedNodeIndex];

            tree.status = 'owned-by-me';
            tree.owner = 'Vous';

            // Mettre à jour l'UI de la map en direct
            const nodeElement = document.getElementById(`node-${tree.id}`);
            nodeElement.className = 'map-node owned-by-me';
            nodeElement.querySelector('.node-price').innerText = '👑';

            // Mettre à jour les stats du joueur (points, revenus, nombre d'arbres)
            userTreesCount += 1;
            totalIncome += tree.income;
            userPoints += 100;

            document.getElementById('user-trees').innerText = userTreesCount;
            document.getElementById('tree-income').innerText = "+" + totalIncome + " pts/j";
            document.getElementById('user-points').innerText = userPoints;

            alert(`⚡ God Mode : Vous venez de capturer la parcelle #${tree.id} et de l'ajouter à votre canopée !`);
            closeModal();
        }

        // Mise à jour en direct des liens Stripe clients
        document.getElementById('admin-stripe-link').addEventListener('input', function() {
            const newLink = this.value;
            document.getElementById('modal-stripe-btn').href = newLink;
        });

        // Lancer la map au chargement
        initMap();
    </script>
</body>
</html>
