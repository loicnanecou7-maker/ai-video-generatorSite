<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Video AI</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { background: linear-gradient(to right, #9333ea, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; text-align: center; margin-bottom: 20px; }
        .card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        textarea { width: 100%; height: 120px; background: #111; color: #fff; border: 1px solid #333; border-radius: 12px; padding: 15px; font-size: 1rem; box-sizing: border-box; outline: none; }
        textarea:focus { border-color: #06b6d4; }
        button { width: 100%; padding: 15px; background: linear-gradient(to right, #9333ea, #06b6d4); color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <h1>FUTURE VIDEO AI</h1>
        <textarea placeholder="Décris ta vidéo ultra-réaliste pour TikTok..."></textarea>
        <button onclick="alert('Génération lancée avec succès !')">Générer la vidéo</button>
    </div>
</body>
</html>
