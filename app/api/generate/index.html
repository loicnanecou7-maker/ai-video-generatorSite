<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Future Video AI</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: height: 100vh; margin: 0; padding: 20px; }
        h1 { background: linear-gradient(to right, #9333ea, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem; }
        textarea { width: 100%; max-width: 400px; height: 100px; background: #111; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        button { width: 100%; max-width: 400px; padding: 15px; background: linear-gradient(to right, #9333ea, #06b6d4); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>FUTURE VIDEO AI (God-Mode)</h1>
    <textarea placeholder="Décris ta vidéo..."></textarea>
    <button onclick="alert('Génération lancée !')">Générer la vidéo</button>
</body>
</html>
